<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribución Yaguarete</title>
    <link rel="stylesheet" href="./estilos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="body">
    <header class="header">
        <nav class="nav">
            <p class="logo">YAGUARETÉ</p>
            <button class="hamburger" id="hamburger" type="button" aria-label="Abrir menú" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav_list" id="nav_list">
                <li class="nav_item"><a class="a" href="#">Inicio</a></li>
                <li class="nav_item"><a class="a" href="#">Productos</a></li>
                <li class="nav_item"><a class="a" href="#">Sobre nosotros</a></li>
                <li class="nav_item"><a class="a" href="#">Ubicación</a></li>
                <li class="nav_item"><a class="a" href="#">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="portada">
            <img src="./imagenes/portada-peque.webp" alt="Portada de Yaguarete" class="portada_img" srcset="./imagenes/portada-peque.webp 400w, ./imagenes/portada-medio.webp 768w, ./imagenes/portada.webp 1000w" sizes="(max-width: 700px) 100vw, 900px" loading="eager">
            <div class="portada_buttons">
                <a href="" class="portada_button" target="_blank" rel="noopener noreferrer"><i class="bi bi-whatsapp"></i>Contactanos</a>
                <a href="https://www.instagram.com/yaguarete_distribuciones?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" class="portada_button" target="_blank" rel="noopener noreferrer"><i class="bi bi-instagram"></i>Seguinos</a>
            </div>
        </div>

    <section class="section">
        <div class="section_content">
            <img class="tarjeta"  src="./imagenes/vinos.jpeg" alt="Vinos">
            <h6 class="section_title">Nuestros Productos</h6>
        </div>
        <div class="section_content">
            <img class="tarjeta"  src="./imagenes/cerveza.jpeg" alt="Cerveza">
            <h6 class="section_title">Nuestros Productos</h6>
        </div>
        <div class="section_content">
            <img class="tarjeta" src="./imagenes/alfajores.jpeg" alt="Alfajores">
            <h6 class="section_title">Nuestros Productos</h6>
        </div>
        <div class="section_content">
            <img class="tarjeta" src="./imagenes/comida-dog.jpeg" alt="Comida para perros">
            <h6 class="section_title">Nuestros Productos</h6>
        </div>
    </section>
    <footer class="footer">
        <p class="footer_text">&copy; 2023 Distribución Yaguarete. Todos los derechos reservados.</p>

    <script src="./javascript.js"></script>
